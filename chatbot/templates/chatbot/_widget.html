{% load static %}
<link rel="stylesheet" href="{% static 'chatbot/chatbot.css' %}">
<div class="chatbot" id="chatbot" data-message-url="{% url 'chatbot:message' %}" data-contact-url="{% url 'chatbot:contact' %}" data-phone="{{ practice.main_phone }}">
  <button type="button" class="chatbot-launcher" aria-expanded="false" aria-controls="chatbot-panel">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.7A8 8 0 1 1 21 12z"/></svg>
    <span>Questions? Chat with us</span>
  </button>
  <section class="chatbot-panel" id="chatbot-panel" role="dialog" aria-modal="false" aria-labelledby="chatbot-title" hidden>
    <header class="chatbot-header">
      <div>
        <h2 id="chatbot-title">Alderwick Assistant</h2>
        <p>Automated answers &middot; not for emergencies</p>
      </div>
      <button type="button" class="chatbot-close" aria-label="Close chat">&times;</button>
    </header>
    <p class="chatbot-notice">Medical emergency? Call 911. Please don't share detailed health information in this chat.</p>
    <div class="chatbot-log" role="log" aria-live="polite" aria-label="Chat messages"></div>
    <div class="chatbot-suggestions" aria-label="Suggested questions"></div>
    <form class="chatbot-contact" hidden novalidate>
      {% csrf_token %}
      <p class="chatbot-contact-title">Send your question to our front office</p>
      <label>Name<input class="input" name="name" maxlength="120" autocomplete="name" required></label>
      <label>Email<input class="input" type="email" name="email" maxlength="254" autocomplete="email"></label>
      <label>Phone<input class="input" type="tel" name="phone" maxlength="20" autocomplete="tel"></label>
      <label>Your question<textarea class="input" name="message" rows="3" maxlength="1000" required></textarea></label>
      <div class="chatbot-hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="chatbot-help">Give us an email or phone number. Please leave out medical details.</p>
      <p class="chatbot-error" role="alert"></p>
      <div class="chatbot-contact-actions">
        <button class="btn btn-sm" type="submit">Send to staff</button>
        <button class="btn btn-secondary btn-sm" type="button" data-action="cancel-contact">Cancel</button>
      </div>
    </form>
    <form class="chatbot-input">
      <label class="sr-only" for="chatbot-text">Type your question</label>
      <input class="input" id="chatbot-text" maxlength="500" autocomplete="off" placeholder="Ask about hours, insurance, booking...">
      <button class="btn" type="submit">Send</button>
    </form>
  </section>
</div>
<script src="{% static 'chatbot/chatbot.js' %}?v=20261121-2" defer></script>
